name: RVFI next-PC
run-name: >-
  RVFI next-PC ${{ inputs.mode || 'offline' }} p${{ inputs.preparation_attempt || '0' }}
  ${{ inputs.authorization || 'archive-only' }}

on:
  push:
    paths: ["rvfi_nextpc/**", ".github/workflows/rvfi-nextpc.yml"]
  pull_request:
    paths: ["rvfi_nextpc/**", ".github/workflows/rvfi-nextpc.yml"]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [prepare, pair]
        required: true
      source_sha:
        description: Full immutable owner input commit (not archive head)
        type: string
        required: true
      authorization:
        description: Exact memory-admission authorization; all three older epochs closed
        type: string
        required: true
      preparation_attempt:
        description: New memory-admission preparation 1 to 4 total, 0 for the sole pair
        type: choice
        options: ["0", "1", "2", "3", "4"]
        default: "0"
        required: true
      preparation_run:
        description: Successful same-source preparation run ID, required for pair
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: rvfi-nextpc-${{ github.event_name == 'workflow_dispatch' && 'authorized-measurement' || github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    name: Offline contracts and archive only (no HDL)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code_only_changed: ${{ steps.code_scope.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - id: code_scope
        if: github.event_name == 'push'
        run: python3 -B -m rvfi_nextpc.readiness --source-changed >> "$GITHUB_OUTPUT"
      - run: |
          python3 -B -m rvfi_nextpc.seal
          python3 -B -m rvfi_nextpc.dependencies
          python3 -B -m unittest rvfi_nextpc.tests -v
          python3 -B -m rvfi_nextpc.archive

  code_only_make:
    name: CODE_ONLY synthetic GNU make contracts (no HDL or CPU)
    if: github.event_name == 'push' && needs.offline.outputs.code_only_changed == 'true'
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preinstalled GNU make on disposable synthetic recipes only
        run: python3 -B -m rvfi_nextpc.make_contracts --output code-only-output
      - name: Preserve small original code-only receipts, never model artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rvfi-nextpc-code-only-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: code-only-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  hosted:
    name: Bounded dispatched observation and closure (not scientific PASS)
    if: github.event_name == 'workflow_dispatch'
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      AUTHORIZATION: ${{ inputs.authorization }}
      PREPARATION_ATTEMPT: ${{ inputs.preparation_attempt }}
      PREPARATION_RUN: ${{ inputs.preparation_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: No automatic retries; always close Python pipeline receipts
        run: |
          python3 -B -m rvfi_nextpc.hosted --mode "$MODE" --source-sha "$SOURCE_SHA" \
            --authorization "$AUTHORIZATION" --preparation-attempt "$PREPARATION_ATTEMPT" \
            --preparation-run "$PREPARATION_RUN" --output nextpc-output
      - name: Independently check closed raw archive, including STOP
        if: always()
        run: python3 -B -m rvfi_nextpc.archive nextpc-output
      - name: Preserve raw status, sources and console bytes; never model binaries or waves
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rvfi-nextpc-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: nextpc-output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 9
